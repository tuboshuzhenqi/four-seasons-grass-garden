<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>四季草地小花园</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f3ecdd; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="scene" aria-label="可旋转的手绘草地小景"></canvas>
<script>
'use strict';
const TAU = Math.PI * 2;
const canvas = document.querySelector('#scene');
const mainContext = canvas.getContext('2d');
let ctx = mainContext;
const staticLayer = document.createElement('canvas');
let staticContext = staticLayer.getContext('2d'), staticCacheKey='';
const themes = [
  { name: '春', top: '#A9B985', light: '#CAD5A0', dark: '#7C9666', soil: '#B99A79', side: '#98765D', ink: '#51483D' },
  { name: '夏', top: '#78966B', light: '#AEC08A', dark: '#587552', soil: '#A98768', side: '#80634F', ink: '#48483B' },
  { name: '秋', top: '#C39A6B', light: '#D8BD8B', dark: '#A47C56', soil: '#B58A68', side: '#8D6953', ink: '#55463B' },
  { name: '冬', top: '#A6B5B6', light: '#D0D9D2', dark: '#7F969A', soil: '#B2A99B', side: '#89847C', ink: '#4D4B48' }
];
let themeIndex = 0;
let width = 0, height = 0, dpr = 1, scale = 1;
const camera = { angle: -0.68, tilt: 1.02, distance: 5.7 };
const half = 1.15, bottom = -0.55, focal = 580;
let paper = document.createElement('canvas');
let drag = null;

function color(hex, alpha=1) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${alpha})`;
}
function seeded(seed) {
  let x = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}
const FLOWERS = [
  { id:'daisy', name:'雏菊', unlockAt:0, points:1, weight:1.7 },
  { id:'tulip', name:'郁金香', unlockAt:30, points:2, weight:1 },
  { id:'poppy', name:'虞美人', unlockAt:80, points:3, weight:1 },
  { id:'lavender', name:'薰衣草', unlockAt:200, points:4, weight:.35 },
  { id:'dandelion', name:'蒲公英', unlockAt:300, points:5, weight:.32 }
];
const FLOWER_PALETTES = {
  daisy:['#fff0cf','#f7e4a5','#f5c5d2','#efb5c3','#b9d7ee','#c8e0d5','#f0d9bd'],
  tulip:['#f3b9c5','#f7dc91','#b9d9ef','#e6bfd6','#f4c9aa','#c7dfd0'],
  poppy:['#efb7b5','#f5c9aa','#f4dda0','#bfd8ee','#efc5d6','#d4e3bc'],
  lavender:['#9a83a6','#a88da6','#88759d','#b5a0bd','#8276a0'],
  dandelion:['#f8f6ef']
};
function chooseFlower(id, scoreAtBirth) {
  const available=FLOWERS.filter(f=>scoreAtBirth>=f.unlockAt);
  const total=available.reduce((sum,f)=>sum+f.weight,0);
  let roll=seeded(id+100)*total;
  for(const flower of available) {
    roll-=flower.weight;
    if(roll<0) return flower.id;
  }
  return available[available.length-1].id;
}
function flowerProfile(id) { return FLOWERS.find(f=>f.id===id)||FLOWERS[0]; }
function nextFlowerUnlock(total=score) { return FLOWERS.find(f=>f.unlockAt>total)||null; }
const grassBlades=[];
for(let cluster=0;cluster<38;cluster++) {
  const cx=-.78+seeded(cluster+500)*1.56, cz=-.78+seeded(cluster+900)*1.56;
  const phase=seeded(cluster+1300)*TAU;
  for(let blade=0;blade<5;blade++) {
    const id=cluster*11+blade;
    grassBlades.push({
      x:cx+(seeded(id+1700)-.5)*.18,
      z:cz+(seeded(id+2100)-.5)*.18,
      h:.12+seeded(id+2500)*.19,
      baseX:(seeded(id+2900)-.5)*.10,
      side:(seeded(id+3300)-.5)*.10,
      phase:phase+(seeded(id+3700)-.5)*.55,
      tone:seeded(id+4100)
    });
  }
}
let animationTime=0;
let sowMode=false, harvestMode=false, score=0, seeds=[], plants=[], nextSeedId=1, pickups=[], fluffs=[], unlockToast=null;
let butterflies=[], nextButterflyId=1, butterflySpawnTimer=2;
let lastFrameTime=0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  width = innerWidth; height = innerHeight;
  canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  scale = Math.min(1.5, Math.max(1, Math.min(width, height) / 430));
  makePaper(); render();
}
function makePaper() {
  paper.width = Math.max(1, Math.round(width * dpr));
  paper.height = Math.max(1, Math.round(height * dpr));
  const p = paper.getContext('2d');
  p.setTransform(dpr, 0, 0, dpr, 0, 0);
  p.fillStyle = '#f3ecdd'; p.fillRect(0, 0, width, height);
  for (let i = 0; i < 12; i++) {
    const x = seeded(i + 1) * width, y = seeded(i + 31) * height;
    const r = 50 + seeded(i + 61) * 150;
    const g = p.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(210,193,163,.07)'); g.addColorStop(1, 'rgba(210,193,163,0)');
    p.fillStyle = g; p.fillRect(x-r, y-r, r*2, r*2);
  }
  for (let i = 0; i < 1500; i++) {
    const x = seeded(i+100) * width, y = seeded(i+2100) * height;
    p.fillStyle = `rgba(117,99,71,${0.025 + seeded(i+4100)*0.035})`;
    p.fillRect(x, y, .7, .7);
  }
}
function cameraBasis() {
  const sp = Math.sin(camera.tilt), cp = Math.cos(camera.tilt);
  const eye = [camera.distance * sp * Math.sin(camera.angle), camera.distance * cp, camera.distance * sp * Math.cos(camera.angle)];
  const len = Math.hypot(...eye), f = eye.map(v => -v / len);
  // Right = forward × world-up. The previous sign exposed the underside as if it were the lawn.
  const r = [-f[2], 0, f[0]], rl = Math.hypot(...r); r[0] /= rl; r[2] /= rl;
  const u = [r[1]*f[2]-r[2]*f[1], r[2]*f[0]-r[0]*f[2], r[0]*f[1]-r[1]*f[0]];
  const fl = Math.min(width, height) * .5 / Math.tan(38 * Math.PI / 360);
  return p => {
    const d = p[0]*f[0] + p[1]*f[1] + p[2]*f[2] + len;
    if (d < .1) return null;
    return [width/2 + (p[0]*r[0]+p[1]*r[1]+p[2]*r[2]) / d * fl,
            height/2 - (p[0]*u[0]+p[1]*u[1]+p[2]*u[2]) / d * fl];
  };
}
function polygon(points, fill, stroke=null, lineWidth=1) {
  if (points.some(p => !p)) return;
  ctx.beginPath(); ctx.moveTo(points[0][0], points[0][1]);
  for (let i=1; i<points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
  ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
  if (stroke) { ctx.strokeStyle=stroke; ctx.lineWidth=lineWidth*scale; ctx.lineJoin='round'; ctx.stroke(); }
}
function softPolygon(points, hex, alpha, bleed=5) {
  if(points.some(p=>!p)) return;
  ctx.save(); ctx.shadowColor=color(hex,alpha*.56); ctx.shadowBlur=bleed*scale;
  polygon(points,color(hex,alpha*.58)); ctx.restore();
  polygon(points,color(hex,alpha));
}
function wavyEdge(a,b,amplitude,seed) {
  const dx=b[0]-a[0], dz=b[2]-a[2], len=Math.hypot(dx,dz)||1;
  const nx=-dz/len, nz=dx/len, pts=[];
  for(let i=0;i<=12;i++) {
    const t=i/12, fade=Math.sin(Math.PI*t);
    const noise=(seeded(seed+i*13)-.5)*2*amplitude*fade;
    pts.push([a[0]+dx*t+nx*noise,a[1]+(b[1]-a[1])*t,a[2]+dz*t+nz*noise]);
  }
  return pts;
}
function roughSquare(x,y,size,seed) {
  const corners=[[x,y],[x+size,y],[x+size,y+size],[x,y+size]], pts=[];
  for(let e=0;e<4;e++) {
    const a=corners[e], b=corners[(e+1)%4], dx=b[0]-a[0], dy=b[1]-a[1];
    const len=Math.hypot(dx,dy)||1, nx=-dy/len, ny=dx/len;
    for(let k=0;k<4;k++) {
      const t=k/4, fade=Math.sin(Math.PI*t);
      const wobble=(seeded(seed+e*17+k*7)-.5)*2*1.25*scale*fade;
      pts.push([a[0]+dx*t+nx*wobble,a[1]+dy*t+ny*wobble]);
    }
  }
  return pts;
}
function drawTaperedBlade(p0,p1,p2,p3,ink,baseWidth,alpha=.52) {
  const left=[], right=[], steps=10;
  for(let i=0;i<=steps;i++) {
    const t=i/steps, u=1-t;
    const cx=u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0];
    const cy=u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1];
    const dx=3*u*u*(p1[0]-p0[0])+6*u*t*(p2[0]-p1[0])+3*t*t*(p3[0]-p2[0]);
    const dy=3*u*u*(p1[1]-p0[1])+6*u*t*(p2[1]-p1[1])+3*t*t*(p3[1]-p2[1]);
    const len=Math.hypot(dx,dy)||1;
    const taper=Math.pow(1-t,.78), halfWidth=baseWidth*taper*(.78+.22*Math.sin(Math.PI*t));
    left.push([cx-dy/len*halfWidth,cy+dx/len*halfWidth]);
    right.push([cx+dy/len*halfWidth,cy-dx/len*halfWidth]);
  }
  ctx.beginPath(); ctx.moveTo(left[0][0],left[0][1]);
  for(let i=1;i<left.length;i++) ctx.lineTo(left[i][0],left[i][1]);
  for(let i=right.length-1;i>=0;i--) ctx.lineTo(right[i][0],right[i][1]);
  ctx.closePath(); ctx.fillStyle=color(ink,alpha); ctx.fill();
}
function groundPointAtScreen(px,py) {
  const sp=Math.sin(camera.tilt), cp=Math.cos(camera.tilt);
  const eye=[camera.distance*sp*Math.sin(camera.angle),camera.distance*cp,camera.distance*sp*Math.cos(camera.angle)];
  const f=eye.map(v=>-v/camera.distance), r=[-f[2],0,f[0]], rl=Math.hypot(...r);
  r[0]/=rl; r[2]/=rl;
  const u=[r[1]*f[2]-r[2]*f[1],r[2]*f[0]-r[0]*f[2],r[0]*f[1]-r[1]*f[0]];
  const fl=Math.min(width,height)*.5/Math.tan(38*Math.PI/360);
  const sx=(px-width/2)/fl, sy=(height/2-py)/fl;
  const dir=[f[0]+r[0]*sx+u[0]*sy,f[1]+r[1]*sx+u[1]*sy,f[2]+r[2]*sx+u[2]*sy];
  if(dir[1]>=-.015) return null;
  const t=-eye[1]/dir[1];
  const point=[eye[0]+dir[0]*t,0,eye[2]+dir[2]*t];
  if(Math.abs(point[0])>half-.04||Math.abs(point[2])>half-.04) return null;
  return point;
}
function worldPointForScreenAtHeight(px,py,planeY) {
  const sp=Math.sin(camera.tilt), cp=Math.cos(camera.tilt);
  const eye=[camera.distance*sp*Math.sin(camera.angle),camera.distance*cp,camera.distance*sp*Math.cos(camera.angle)];
  const f=eye.map(v=>-v/camera.distance), r=[-f[2],0,f[0]], rl=Math.hypot(...r);
  r[0]/=rl; r[2]/=rl;
  const u=[r[1]*f[2]-r[2]*f[1],r[2]*f[0]-r[0]*f[2],r[0]*f[1]-r[1]*f[0]];
  const fl=Math.min(width,height)*.5/Math.tan(38*Math.PI/360);
  const sx=(px-width/2)/fl, sy=(height/2-py)/fl;
  const dir=[f[0]+r[0]*sx+u[0]*sy,f[1]+r[1]*sx+u[1]*sy,f[2]+r[2]*sx+u[2]*sy];
  if(dir[1]>=-.015) return null;
  const t=(planeY-eye[1])/dir[1];
  if(t<=0) return null;
  return [eye[0]+dir[0]*t,planeY,eye[2]+dir[2]*t];
}
function dropSeedPatchAtScreen(px,py) {
  const p=groundPointAtScreen(px,py); if(!p) return false;
  const count=4+Math.floor(seeded(nextSeedId+3)*4);
  for(let k=0;k<count;k++) {
    const id=nextSeedId++, angle=seeded(id+10)*TAU;
    const radius=.025+Math.sqrt(seeded(id+20))*.095;
    const x=Math.max(-half+.055,Math.min(half-.055,p[0]+Math.cos(angle)*radius));
    const z=Math.max(-half+.055,Math.min(half-.055,p[2]+Math.sin(angle)*radius));
    const crowded=plants.some(item=>(item.x-x)**2+(item.z-z)**2<.055**2)
                  ||seeds.some(item=>(item.x-x)**2+(item.z-z)**2<.055**2);
    if(crowded) continue;
    const startHeight=.42+seeded(id+30)*.35;
    seeds.push({id,x,z,y:startHeight,startHeight,fall:.48+seeded(id+40)*.18,fromX:px,fromY:py});
  }
  if(seeds.length>140) seeds.splice(0,seeds.length-140);
  return true;
}
function updateWorld(dt) {
  for(const seed of seeds) {
    seed.y-=seed.fall*dt;
  }
  for(let i=seeds.length-1;i>=0;i--) if(seeds[i].y<=.02) {
    const seed=seeds.splice(i,1)[0], id=seed.id;
    const type=seeded(id+70)<.22?'flower':'grass';
    const species=type==='flower'?chooseFlower(id,score):'daisy';
    const colors=FLOWER_PALETTES[species];
    const profile=flowerProfile(species);
    const growTime=type==='flower'?7+seeded(id+110)*5:4+seeded(id+110)*2.5;
    plants.push({x:seed.x,z:seed.z,type,age:0,phase:seeded(id+80)*TAU,
                 species,flowerColor:colors[Math.floor(seeded(id+120)*colors.length)],
                 height:(species==='lavender'||species==='dandelion') ? .36+seeded(id+130)*.18 : .25+seeded(id+130)*.21,
                 size:.72+seeded(id+140)*.72,growTime,points:profile.points,
                 petals:species==='daisy'?8+Math.floor(seeded(id+150)*5):species==='poppy'?4+Math.floor(seeded(id+160)*3):species==='tulip'?3:species==='dandelion'?16+Math.floor(seeded(id+170)*8):7+Math.floor(seeded(id+180)*5)});
  }
  const matureFlowers=[];
  for(const plant of plants) {
    plant.age+=dt;
    if(plant.type==='flower'&&!plant.harvested&&plant.age>=plant.growTime) matureFlowers.push(plant);
    if(plant.harvested) {
      plant.harvested.age+=dt;
      if(plant.species==='dandelion'&&!plant.fluffReleased&&plant.harvested.age>.12) {
        plant.fluffReleased=true;
        const y=.02+(plant.height||.42);
        for(let i=0;i<18;i++) {
          const a=seeded(i+plant.phase*100)*TAU, speed=.045+seeded(i+plant.age*10)*.12;
          fluffs.push({x:plant.x+(seeded(i+plant.phase*200)-.5)*.025,y,z:plant.z+(seeded(i+plant.phase*300)-.5)*.025,
                       vx:Math.cos(a)*speed,vy:.035+seeded(i+plant.phase*400)*.13,vz:Math.sin(a)*speed,
                       age:0,life:1.1+seeded(i+plant.phase*500)*.65});
        }
      }
    }
  }
  plants=plants.filter(plant=>plant.harvested?plant.harvested.age<.95:plant.age<(plant.growTime+65));
  for(const butterfly of butterflies) butterfly.age+=dt;
  butterflies=butterflies.filter(butterfly=>butterfly.age<butterfly.life);
  butterflySpawnTimer-=dt;
  const butterflyLimit=matureFlowers.length>=5?Math.min(5,Math.floor(matureFlowers.length/3)):0;
  if(butterflyLimit>butterflies.length&&butterflySpawnTimer<=0) {
    const id=nextButterflyId++, host=matureFlowers[Math.floor(seeded(id+17)*matureFlowers.length)];
    const roll=seeded(id+29);
    const colors=roll<.68?['#fffdf6',.92]:roll<.80?['#efbfd0',.84]:roll<.90?['#f1d78c',.88]:['#b9d7ee',.9];
    const entrySide=seeded(id+79)<.5?-1:1, entryY=height*(.58+seeded(id+89)*.17);
    let entry=worldPointForScreenAtHeight(entrySide<0?-42:width+42,entryY,.48);
    if(!entry) entry=worldPointForScreenAtHeight(entrySide<0?-42:width+42,height*.78,.48);
    if(!entry) entry=[host.x+entrySide*3,.48,host.z+.8];
    const entersFor=8+seeded(id+127)*4;
    butterflies.push({id,startX:entry[0],startZ:entry[2],targetX:host.x,targetZ:host.z,host,
                       phase:seeded(id+37)*TAU,speed:.28+seeded(id+47)*.22,span:.13+seeded(id+57)*.15,
                       entersFor,willPerch:seeded(id+97)<.27,perchAfter:entersFor+2+seeded(id+107)*2.5,
                       perchFor:2.2+seeded(id+117)*1.5,color:colors[0],alpha:colors[1],age:0,life:18+seeded(id+67)*8});
    butterflySpawnTimer=2+seeded(id+77)*2.5;
  } else if(butterflyLimit===0) butterflySpawnTimer=Math.max(butterflySpawnTimer,1.5);
  for(const fluff of fluffs) {
    fluff.age+=dt; fluff.x+=fluff.vx*dt; fluff.y+=fluff.vy*dt;
    fluff.z+=fluff.vz*dt; fluff.vy-=.045*dt;
  }
  fluffs=fluffs.filter(fluff=>fluff.age<fluff.life);
  for(const pickup of pickups) pickup.age+=dt;
  pickups=pickups.filter(p=>p.age<.9);
  if(unlockToast) {
    unlockToast.age+=dt;
    if(unlockToast.age>2.8) unlockToast=null;
  }
}
function drawWobblyLine(a, b, project, ink, w, seed) {
  const A = project(a), B = project(b); if (!A || !B) return;
  const dx = B[0]-A[0], dy = B[1]-A[1], len = Math.hypot(dx,dy) || 1;
  const bend = (seeded(seed)-.5)*2.4*scale;
  const mx=(A[0]+B[0])/2 - dy/len*bend, my=(A[1]+B[1])/2 + dx/len*bend;
  ctx.beginPath(); ctx.moveTo(A[0], A[1]);
  ctx.quadraticCurveTo(mx, my, B[0], B[1]);
  ctx.strokeStyle = color(ink, .49); ctx.lineWidth = w*scale; ctx.lineCap='round'; ctx.stroke();
  // A faint offset pass gives the contour a soft, imperfect ink edge.
  ctx.beginPath(); ctx.moveTo(A[0]+.8*scale, A[1]+.5*scale);
  ctx.quadraticCurveTo(mx+.8*scale, my+.5*scale, B[0]+.8*scale, B[1]+.5*scale);
  ctx.strokeStyle = color(ink, .12); ctx.lineWidth = w*.62*scale; ctx.stroke();
}
function washBlob(cx, cz, rx, rz, project, hex, alpha, seed) {
  const pts=[];
  for(let i=0;i<13;i++) {
    const a=i/13*TAU, wobble=.78+seeded(seed+i*17)*.43;
    pts.push(project([cx+Math.cos(a)*rx*wobble,.014,cz+Math.sin(a)*rz*wobble]));
  }
  if(pts.some(p=>!p)) return;
  ctx.save();
  ctx.shadowColor=color(hex,alpha*.48); ctx.shadowBlur=9*scale;
  polygon(pts,color(hex,alpha));
  ctx.restore();
  // Offset wash, like pigment settling unevenly into paper.
  polygon(pts.map(p=>[p[0]+1.6*scale,p[1]+.9*scale]),color(hex,alpha*.34));
}
function drawGrassWash(project, pal) {
  // Soft, overlapping pigment blooms keep the lawn from reading as a flat polygon.
  const patches=[
    [-.54,.48,.54,.34,pal.dark,.16],[-.18,.12,.62,.43,pal.light,.22],
    [.43,.36,.44,.33,pal.dark,.13],[.51,-.36,.43,.31,pal.light,.18],
    [-.45,-.47,.48,.31,pal.light,.16],[.03,-.28,.57,.37,pal.dark,.12]
  ];
  patches.forEach(([x,z,rx,rz,tone,alpha],i)=>washBlob(x,z,rx,rz,project,tone,alpha,80+i*21));
}
function drawGrassBlades(project, pal, time) {
  // Fixed clumps of tapered blades sway together in a slow, passing breeze.
  for(const blade of grassBlades) {
    const gust=Math.sin(time*1.05+blade.phase+blade.x*1.6+blade.z*.8)*.075
               +Math.sin(time*.43+blade.phase*.6)*.025;
    const lean=blade.baseX+gust, side=blade.side+Math.sin(time*.82+blade.phase)*.018;
    const y=.018, h=blade.h;
    const p0=project([blade.x,y,blade.z]);
    const p1=project([blade.x+lean*.16,y+h*.34,blade.z+side*.22]);
    const p2=project([blade.x+lean*.62,y+h*.73,blade.z+side*.68]);
    const p3=project([blade.x+lean,y+h,blade.z+side]);
    if(!p0||!p1||!p2||!p3) continue;
    const ink=blade.tone>.76?pal.light:blade.tone>.34?pal.dark:pal.top;
    drawTaperedBlade(p0,p1,p2,p3,ink,(1.05+blade.h*.7)*scale,.52);
  }
}
function drawPlants(project,pal) {
  const sorted=[...plants].sort((a,b)=>(a.x*Math.sin(camera.angle)+a.z*Math.cos(camera.angle))-
                                      (b.x*Math.sin(camera.angle)+b.z*Math.cos(camera.angle)));
  for(const plant of sorted) {
    const isFlower=plant.type==='flower', duration=plant.growTime|| (isFlower?8:5.5);
    const lifetime=duration+65, fadeDuration=isFlower?7:5;
    const lifeFade=Math.min(1,Math.max(0,(lifetime-plant.age)/fadeDuration));
    const harvestT=plant.harvested?Math.min(1,plant.harvested.age/.95):0;
    const fade=lifeFade*(1-harvestT);
    if(fade<=0) continue;
    ctx.save(); ctx.globalAlpha=fade;
    const growth=Math.min(1,plant.age/duration);

    const dx=e.clientX-drag.x,dy=e.clientY-drag.y,dist=Math.hypot(dx,dy);
    const spacing=38*scale;
    if(dist>0) {
      const needed=spacing-drag.distance;
      let along=needed;
      while(along<=dist) {
        const t=along/dist;
        dropSeedPatchAtScreen(drag.x+dx*t,drag.y+dy*t);
        along+=spacing;
      }
      drag.distance=(drag.distance+dist)%spacing;
      drag.x=e.clientX; drag.y=e.clientY;
    }
    return;
  }
  if(drag.harvesting) {
    harvestAlongSegment(drag.x,drag.y,e.clientX,e.clientY);
    drag.x=e.clientX; drag.y=e.clientY; return;
  }
  camera.angle=drag.angle-(e.clientX-drag.x)*.008;
  camera.tilt=Math.max(.55,Math.min(1.38,drag.tilt-(e.clientY-drag.y)*.006)); render();
});
canvas.addEventListener('pointerup',()=>drag=null); canvas.addEventListener('pointercancel',()=>drag=null);
canvas.addEventListener('wheel',e=>{camera.distance=Math.max(4.3,Math.min(8,camera.distance+e.deltaY*.003));render();e.preventDefault();},{passive:false});
canvas.addEventListener('click',e=>{
  if(hitSowButton(e.clientX,e.clientY)) { sowMode=!sowMode; if(sowMode) harvestMode=false; drag=null; render(); return; }
  if(hitHarvestButton(e.clientX,e.clientY)) { harvestMode=!harvestMode; if(harvestMode) sowMode=false; drag=null; render(); return; }
  const swatch=swatchAt(e.clientX,e.clientY);
  if(swatch>=0) { themeIndex=swatch; render(); return; }
});
window.addEventListener('resize',resize); resize(); requestAnimationFrame(animate);
</script>
</body>
